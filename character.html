<h1>好きなキャラクター紹介</h1>

<h2>時透無一郎</h2>

<img src="image/muitirou.jpg" alt="時透無一郎">

<p>
時透無一郎は鬼殺隊の霞柱で、
鬼殺隊の中でも最年少で柱になった天才剣士です。
</p>

<p>
普段は冷静な性格ですが、仲間を思う優しさや
戦闘で見せる強さが魅力的なキャラクターです。
</p>


<h3>アニメで好きな場面</h3>

<p>
刀鍛冶の里編での時透無一郎の活躍シーンが特に好きです。
成長していく姿や強さを見ることができる印象的な場面です。
</p>
